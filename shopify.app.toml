# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "ee454c5e5eea80753c6628ab330db822"
name = "PieceUp"
# Pinned rather than left to Shopify's auto-generated value: the handle is the
# app's admin URL slug, and changing it later breaks any saved admin links.
handle = "pieceup"
application_url = "https://piece-up.app"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
#
# read_orders backs revenue attribution: the app issues discount codes but
# never sees a checkout, so the orders webhooks are the only way to tell a
# merchant what their campaign actually earned.
#
# It is a protected customer data scope and has to be approved in the Partner
# Dashboard before it works in production. `read_all_orders` is deliberately
# not requested — that one exists to read orders older than 60 days, and
# attribution only ever handles orders arriving live from now on.
scopes = "write_products,write_metaobjects,write_metaobject_definitions,write_files,write_discounts,read_orders"

[product.metafields.app.demo_info]
type = "single_line_text_field"
name = "Demo Source Info"
description = "Tracks products created by the Shopify app template for development"

  [product.metafields.app.demo_info.access]
  admin = "merchant_read_write"

[metaobjects.app.example]
name = "Example"
description = "An example metaobject definition created by this template"

  [metaobjects.app.example.access]
  admin = "merchant_read_write"

[metaobjects.app.example.fields.title]
name = "Title"
type = "single_line_text_field"
required = true

[metaobjects.app.example.fields.description]
name = "Description"
type = "multi_line_text_field"

# Required by the CLI even though PieceUp subscribes to nothing. Events are a
# separate system from [webhooks] below: they watch shop resources (products,
# orders) with custom queries. PieceUp only needs the two app-lifecycle
# webhooks, so this declares the version with an empty subscription list.
# "unstable" is the only value accepted here — events are still in beta, so
# this deliberately doesn't track the dated version used for webhooks below.
[events]
api_version = "unstable"
subscription = []

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  # Revenue attribution. orders/create rather than orders/paid: cash on
  # delivery and bank transfer are common in the shops this app targets, and
  # for those `paid` arrives days later or never — the campaign would look
  # like it earned nothing. Cancellations are subtracted separately instead,
  # which keeps the total honest without waiting on payment capture.
  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/create"
  topics = [ "orders/create" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/cancelled"
  topics = [ "orders/cancelled" ]

  # The three privacy webhooks Shopify requires of every public app. Not
  # optional and not tied to the orders scopes — an app that stores anything
  # about a shopper has to be able to say what it holds and to erase it.
  #
  # Declared with `compliance_topics`, not `topics`. They are the same three
  # strings either way, and `shopify app config validate` accepts both, but
  # only this key registers them: as ordinary topics the server rejects them
  # outright with "The following topic is invalid".
  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = [ "customers/data_request" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = [ "customers/redact" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = [ "shop/redact" ]

[auth]
redirect_urls = [ "https://piece-up.app/api/auth" ]

[app_proxy]
url = "https://piece-up.app/apps/pieceup"
prefix = "apps"
subpath = "pieceup"

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true
