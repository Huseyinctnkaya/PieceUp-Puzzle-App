<!doctype html>
<html>
  <body>
    <!-- Mirrors what the admin preview does: pull the bundle in through a blob
         module and mount it into a shadow root with its own stylesheet, with
         neither widget.js nor the app proxy involved. -->
    <div id="preview-host"></div>
    <script type="module">
      window.__mountPreview = async (settings, onComplete) => {
        const host = document.getElementById("preview-host");
        const shadow = host.attachShadow({ mode: "open" });
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = "../../assets/pieceup-app.css";
        shadow.appendChild(link);
        const container = document.createElement("div");
        shadow.appendChild(container);

        const url = new URL("../../assets/pieceup-app.js", location.href).href;
        const blob = URL.createObjectURL(
          new Blob([`export * from "${url}";`], { type: "text/javascript" }),
        );
        const { mountPuzzle } = await import(blob);
        URL.revokeObjectURL(blob);

        window.__handle = mountPuzzle(
          container,
          settings,
          onComplete ?? (() => {}),
        );
        return true;
      };
    </script>
  </body>
</html>
